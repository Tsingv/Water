[package]
name = "water"
version = "0.2.8"
edition = "2024"
default-run = "water"
description = "A native Rust desktop development workbench."
license = "MIT OR Apache-2.0"

[lib]
name = "water"
path = "src/lib.rs"

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:gpui_platform"]
# Keep the runtime screenshot hook available to the local control interface.
# GPUI gates its scene-to-image API behind this feature.
runtime-screenshot = ["gui", "gpui/test-support", "gpui_platform/test-support", "dep:image"]
# Reserved for tracing/profiling integrations; disabled by default in release builds.
profiling = []


[profile.dev]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
overflow-checks = false

[[bin]]
name = "water"
path = "src/main.rs"
required-features = ["gui"]


[[bin]]
name = "water-server"
path = "src/bin/water-server.rs"

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1.0"
image = { version = "0.25.10", optional = true }
libc = "0.2"
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "ce48461eaadd16c65c31f835511ab96bd3b6e746", default-features = false, features = ["font-kit"], optional = true }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "ce48461eaadd16c65c31f835511ab96bd3b6e746", features = ["font-kit"], optional = true }
polling = "3.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
smallvec = { version = "1.15", features = ["serde"] }
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dependencies.uuid]
version = "1.26.1"
features = ["v4", "serde"]

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "ce48461eaadd16c65c31f835511ab96bd3b6e746", default-features = false, features = ["font-kit", "test-support"] }

# Both dev and release are optimized; their runtime identities remain isolated.

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1


[patch."https://github.com/zed-industries/zed.git"]
media = { path = "scripts/stub-media" }
gpui_apple = { path = "scripts/stub-gpui_apple" }
